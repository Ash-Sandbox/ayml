%YAML 1.2
%TAG !e! tag:example.com,2024:
---
# Complex mapping key (leading "? "): a folded multi-line scalar used as a key.
# Cursed but hashable, so every parser can construct it.
? >-
  this entire folded
  scalar is one map key
: &shared
    origin: anchored mapping
    depth: 1
# An explicit null key (~) carrying a value.
? ~
: value keyed by null
# Quoted keys may contain : and # with no structural meaning.
"quoted key with : colon and # hash":
  # Merge key pulls the anchored MAPPING above into this map...
  <<: *shared
  # ...and this local key overrides the merged-in 'depth'.
  depth: 2
  # A custom-tagged scalar resolved via the %TAG directive at the top.
  typed: !e!thing "custom tag value"
...
%YAML 1.2
%TAG !e! tag:example.com,2024:
---
# Directives and anchors are per-document, so both are redeclared here.
- &num !!int "42"
- *num                       # alias to the node above
- ! "non-specific tag forces a plain string"
- "double \
  quoted continuation eats the newline and leading whitespace"
- 'single ''quote'' escape'
- {flow: {map: [with, {nested: seqs}]}}
# Look like booleans/numbers but are PLAIN STRINGS under the 1.2 core schema:
- [yes, no, on, off, 0o7x, 1:30:00, +.inf.]
# Actually resolve to typed values under 1.2 core:
- [true, false, null, ~, 42, 3.14, 0o17, 0x1F, .inf, .nan]
...
