# yaml-language-server: $schema=https://hub.ashell.dev/schemas/policy/v1.json

schema_version: 1
dependencies:
  ash/base-macos: ^0
  ash/claude-code: ^0
  ash/git: ^0
  ash/github: ^0
  ash/rust-dev: ^0
files:
  rules:
  - path: ./**
  - path: /Applications/Ash.app
    operations:
    - read
  - path: /Applications/Ash.app/Contents/Info.plist
    operations:
    - read
  - path: /Applications/Ash.app/Contents/MacOS/Ash
    operations:
    - read
  - path: /Applications/Ash.app/Contents/Resources
    operations:
    - read
  - path: /Applications/Visual Studio Code.app/Contents/Resources/app/bin/code
    operations:
    - read
  - path: /Library/Apple/usr/bin
    operations:
    - read
  - path: /Users
    operations:
    - read
  - path: /opt/X11/bin
    action: deny
  - path: /opt/homebrew/Caskroom/antigravity-cli/**
  - path: /opt/homebrew/bin/agy
  - path: ~/.cache/tree-sitter/**
  - path: ~/.gemini/**
  - path: ~/.npm/_cacache/**
    operations:
    - create
    - rename
  - path: ~/.npm/_logs/**
  - path: ~/.npm/_update-notifier-last-checked
    operations:
    - write
  - path: ~/.zprofile
    action: deny
    operations:
    - read
  - path: ~/Library/Application Support/**
    action: deny
  - path: ~/Library/Audio
    operations:
    - read
  - path: ~/Library/Audio/Plug-Ins
    operations:
    - read
  - path: ~/Library/Python/3.9/lib/python/site-packages
    operations:
    - read
  - path: ~/Projects
    operations:
    - read
  - path: ~/Projects/tree-sitter-ayml/**
    operations:
    - read
network:
  rules:
  - host: yaml.org
  - host: zed.dev
    ports:
    - 443
exec:
  rules:
  - path: ./ayml/fuzz/target/**
  - path: ./target/**
  - path: /opt/homebrew/Caskroom/antigravity-cli/**
  - path: /opt/homebrew/Cellar/llvm@20/**
  - path: /opt/homebrew/Cellar/node/25.8.1_1/bin/node
  - path: /opt/homebrew/Cellar/python@3.14/**
  - path: /opt/homebrew/Cellar/tree/*/bin/tree
  - path: ~/.cargo/bin/cargo-fuzz
  - path: ~/.cargo/bin/samply
  - path: ~/Library/Caches/ms-playwright-go/1.57.0/node
  - path: ~/Projects/ayml/tree-sitter-ayml/node_modules/tree-sitter-cli/tree-sitter
io_devices:
  rules: []
