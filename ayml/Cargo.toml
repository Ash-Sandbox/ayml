[package]
name = "ayml"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "simplified YAML variant"
authors = ["Alex Shapiro"]
repository = "https://github.com/alex-shapiro/ayml"
readme = "../README.md"
keywords = ["ayml", "yaml"]
categories = ["config", "parsing"]

[features]
schemars = ["dep:schemars"]

[lints]
workspace = true

[dependencies]
ayml-core = { path = "../ayml-core", version = "0.1.0" }
indexmap = { version = "2.13.0", features = ["serde"] }
ryu = "1"
schemars = { version = "0.8", features = ["indexmap2"], optional = true }
serde = { version = "1", features = ["derive"] }
thiserror = "2.0.18"

[dev-dependencies]
ayml-testgen = { path = "../ayml-testgen" }
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1"
proptest-derive = "0.8"
serde_bytes = "0.11"
serde_json = "1"

[[bench]]
name = "serde"
harness = false

[[bench]]
name = "serde_comparison"
harness = false
