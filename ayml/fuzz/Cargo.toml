[package]
name = "ayml-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde = { version = "1", features = ["derive"] }

[dependencies.ayml]
path = ".."

[dependencies.ayml-core]
path = "../../ayml-core"

[dependencies.ayml-testgen]
path = "../../ayml-testgen"

[workspace]
members = ["."]

[[bin]]
name = "fuzz_deserialize"
path = "fuzz_targets/fuzz_deserialize.rs"
doc = false

[[bin]]
name = "fuzz_roundtrip"
path = "fuzz_targets/fuzz_roundtrip.rs"
doc = false

[[bin]]
name = "fuzz_core_roundtrip"
path = "fuzz_targets/fuzz_core_roundtrip.rs"
doc = false

[[bin]]
name = "fuzz_typed"
path = "fuzz_targets/fuzz_typed.rs"
doc = false

[[bin]]
name = "fuzz_streaming_vs_tree"
path = "fuzz_targets/fuzz_streaming_vs_tree.rs"
doc = false
