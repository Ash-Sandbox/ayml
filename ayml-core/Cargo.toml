[package]
name = "ayml-core"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "AYML parser and emitter"
authors = ["Alex Shapiro"]
repository = "https://github.com/alex-shapiro/ayml"
readme = "../README.md"
keywords = ["ayml", "yaml", "parser"]
categories = ["config", "parsing"]

[lints]
workspace = true

[dependencies]
indexmap = "2.13.0"
ryu = "1"

[dev-dependencies]
ayml-testgen = { path = "../ayml-testgen" }
proptest = "1"
serde_json = "1"
